baseURL = "https://www.gouter-gourmand.fr/"
title = "Goûter Gourmand"
theme = "gouter-gourmand"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
removePathAccents = true
enableRobotsTXT = false
buildFuture = false
enableEmoji = false

[pagination]
  pagerSize = 12

[languages]
  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    weight = 1
    title = "Goûter Gourmand"
    contentDir = "content/fr"
    [languages.fr.params]
      description = "Le goûter maison expliqué : pourquoi un gâteau retombe, ce qu'un four d'entrée de gamme change vraiment, et comment faire sans four, sans beurre ou sans sucre sans tout rater."
      tagline = "ce qui rate, et pourquoi"
      ticker = [
        "Nouveaux articles mardi et vendredi",
        "Ce qui rate, et pourquoi",
        "Testé dans un four qui chauffe mal",
        "Des recettes expliquées, pas recopiées",
      ]

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    title = "Goûter Gourmand"
    contentDir = "content/en"
    [languages.en.params]
      description = "Home baking, explained: why a cake sinks, what a cheap oven really changes, and how to bake without an oven, without butter or without sugar and still get it right."
      tagline = "what goes wrong, and why"
      ticker = [
        "New articles every Tuesday and Friday",
        "What goes wrong, and why",
        "Tested in an oven that heats unevenly",
        "Recipes explained, not copied",
      ]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "LLMS"]

[taxonomies]
  category = "categories"
  tag = "tags"

[[languages.fr.menus.main]]
  name = "Le blog"
  url = "/blog/"
  weight = 1
[[languages.fr.menus.main]]
  name = "Faire sans"
  url = "/categories/faire-sans/"
  weight = 2
[[languages.fr.menus.main]]
  name = "À propos"
  url = "/a-propos/"
  weight = 3

[[languages.en.menus.main]]
  name = "Blog"
  url = "/en/blog/"
  weight = 1
[[languages.en.menus.main]]
  name = "Baking without"
  url = "/en/categories/baking-without/"
  weight = 2
[[languages.en.menus.main]]
  name = "About"
  url = "/en/about/"
  weight = 3

[params]
  default_og_image = "/images/og-default.jpg"
  logo = "/favicon.svg"
  founding_year = "2026"
  site_author_key = "marion-kieffer"
  og_locale_alternate = "en_US"
  # Budget du title RENDU : le thème suffixe " | Goûter Gourmand" (18 caractères),
  # donc un title de frontmatter ne dépasse jamais 42 caractères.
  title_budget = 42

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
