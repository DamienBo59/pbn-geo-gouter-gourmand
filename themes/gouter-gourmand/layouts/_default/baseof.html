<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default .Site.Language.Lang }}">
<head>
  {{ partial "seo-head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">{{ i18n "skip_to_content" | default "Aller au contenu" }}</a>
  {{ partial "ticker.html" . }}
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    (function () {
      var t = document.querySelector('.nav-toggle');
      var n = document.getElementById('site-nav');
      if (!t || !n) return;
      t.addEventListener('click', function () {
        var open = n.classList.toggle('is-open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
